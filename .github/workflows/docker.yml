name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json
      - 'src/**'
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json
      - 'src/**'
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-py-playwright-workbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the workbench and wait for the UI
        run: |
          docker run -d --name workbench -p 7860:7860 ai-py-playwright-workbench:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then
              echo "UI is up"
              exit 0
            fi
            sleep 2
          done
          echo "UI did not come up"
          docker logs workbench
          exit 1

      - name: Check it runs as a non-root user
        run: test "$(docker exec workbench id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs workbench || true
