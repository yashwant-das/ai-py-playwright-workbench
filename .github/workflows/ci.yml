name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Python lint and format (ruff)
        run: npm run lint:py

      - name: Python types (mypy, strict)
        run: npm run lint:types

      - name: TypeScript types (tsc)
        run: npm run type-check

      - name: JavaScript and TypeScript lint (eslint)
        run: npm run lint:js

      - name: Formatting (prettier)
        run: npm run lint:format

      - name: Markdown lint
        run: npm run lint:md

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The syntax-tree repair runs through Node (ts-morph).
      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync --group dev

      # Fails under 85% line and branch coverage (pyproject.toml).
      - name: Unit tests with coverage
        run: |
          uv run python -m pytest -q --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (real Chromium, Demo and fake models)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and heal specs against a real browser
        env:
          WORKBENCH_WORKSPACE: ${{ github.workspace }}/workspace
        run: uv run python -m pytest tests/integration -v --junitxml=reports/integration-pytest.xml

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-report
          path: |
            reports/
            workspace/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI (Playwright Test, axe, Demo model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the app in Chromium
        run: npm run test:ui

      - name: Upload the UI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/ui/
          if-no-files-found: warn
          retention-days: 14
