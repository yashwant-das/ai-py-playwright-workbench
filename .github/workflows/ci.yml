name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Python lint (ruff)
        run: uv run ruff check .

      - name: Python format check (ruff)
        run: uv run ruff format --check .

      - name: Python type check (mypy)
        run: uv run mypy

      - name: Python unit tests (with coverage)
        run: |
          uv run python -m pytest tests/unit_test_*.py -q --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

      - name: TypeScript type check (tsc)
        run: npm run type-check

      - name: JavaScript lint (eslint)
        run: npm run lint:js

      - name: Markdown lint
        run: npm run lint:md

  e2e:
    name: End-to-end (generate + heal, stubbed LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and heal specs against a real browser
        run: uv run python -m pytest tests/e2e/e2e_test_pipeline.py -v --junitxml=reports/e2e-pytest.xml

      - name: Re-run generated and healed specs for the report
        run: npm run test:e2e:report

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            reports/
            playwright-report/
            test-results/
            tests/generated/
            tests/artifacts/
            logs/traces.jsonl
          if-no-files-found: warn
          retention-days: 14
