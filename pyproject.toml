[project]
name = "ai-py-playwright-workbench"
version = "1.0.0"
description = "A modular, LLM-powered QA automation agent that generates and maintains Playwright tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright==1.57.0",
    "gradio==6.28.0",
    "openai==3.19.2",
    "beautifulsoup4==4.14.3",
    "python-dotenv==1.2.3",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=2.3.1",
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length compatible with Black
line-length = 88

# Exclude list
exclude = [
    ".git",
    ".venv",
    "_build",
    "build",
    "dist",
    "tests/artifacts",
]

[tool.ruff.lint]
# pycodestyle (E, W), Pyflakes (F), isort (I), bugbear (B), pyupgrade (UP),
# flake8-bandit (S), simplify (SIM), comprehensions (C4), pie (PIE),
# return (RET) and Ruff's own rules (RUF).
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = [
    "E501",   # line length is left to the formatter
    "E402",   # some modules set up sys.path before importing
    "RUF001", # en dashes in UI strings, docstrings and comments are intentional
    "RUF002",
    "RUF003",
    "UP042",  # StrEnum changes str() output that artifacts and prompts rely on
]

[tool.ruff.lint.per-file-ignores]
# Tests use temp paths, subprocess fixtures and nested mock contexts freely,
# and may carry noqa comments for linters this project does not run.
"tests/**" = ["S", "SIM117", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["unit_test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src", "schemas", "benchmarks"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
files = ["src", "schemas", "benchmarks"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true
