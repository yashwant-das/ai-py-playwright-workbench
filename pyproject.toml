[project]
name = "ai-py-playwright-workbench"
version = "2.0.0.dev0"
description = "Generates Playwright tests and heals failing ones with local LLMs"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "playwright==1.63.0",
    "openai==2.14.0",
    "beautifulsoup4==4.14.3",
    "pydantic>=2.0.0",
    "httpx==0.28.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pygments==2.21.0",
]

[project.scripts]
workbench = "workbench.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=2.3.1",
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.ruff]
# Target Python version
target-version = "py313"

# Line length compatible with Black
line-length = 88
src = ["src", "tests"]

# Exclude list
exclude = [
    ".git",
    ".venv",
    "_build",
    "build",
    "dist",
    "tests/artifacts",
]

[tool.ruff.lint]
# pycodestyle (E, W), Pyflakes (F), isort (I), bugbear (B), pyupgrade (UP),
# flake8-bandit (S), simplify (SIM), comprehensions (C4), pie (PIE),
# return (RET) and Ruff's own rules (RUF).
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = [
    "E501",   # line length is left to the formatter
    "RUF001", # en dashes in UI strings, docstrings and comments are intentional
    "RUF002",
    "RUF003",
    "UP042",  # StrEnum changes str() output that artifacts and prompts rely on
]

[tool.ruff.lint.per-file-ignores]
# Tests use temp paths, subprocess fixtures and nested mock contexts freely,
# and may carry noqa comments for linters this project does not run.
"tests/**" = ["S", "SIM117", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/workbench"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85

[tool.mypy]
python_version = "3.13"
files = ["src/workbench"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# Pygments ships no type information.
module = ["pygments", "pygments.*"]
ignore_missing_imports = true
